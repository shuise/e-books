<p id="filepos5458856" class="calibre_"><span class="calibre1"><span class="bold">旧约 -- 诗篇(Psalms) -- 第 117 章 ( 本篇共有 150 章 ) 　</span></span></p><p class="calibre_1">117:1 万国阿，你们都当赞美耶和华。万民哪，你们都当颂赞他。</p><p class="calibre_1">O Praise the LORD, all ye nations: praise him, all ye people.</p><p class="calibre_1">117:2 因为他向我们大施慈爱。耶和华的诚实存到永远。你们要赞美耶和华。</p><p class="calibre_1">For his merciful kindness is great toward us: and the truth of the LORD endureth for ever. Praise ye the LORD.</p><div class="mbp_pagebreak" id="calibre_pb_596"></div>
